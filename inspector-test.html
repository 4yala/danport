<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/project-style.css">
    <title>Title</title>
</head>

<body>
    <div id="site-header"></div>
    
    
    <div id="project-inspector" class="screen-overlay">
        <button  type="button" class="inspector-concealer">
          Close  
        </button>
        
        <article class="inspector-container">
            <h2 data-title> Title placeholder</h2>
            <div class="inspector-thumbnail">
                <img data-thumbnail src="images/projects/website-thumbnail.png" alt="">
            </div>
            <ul data-tags class="inspector-tags">
                <li class="tag">
                    <span>Dummy tag</span>
                </li>
                <li class="tag">
                    <span>Dummy tag</span>
                </li>
                <li class="tag">
                    <span>Dummy tag</span>
                <li class="tag">
                    <span>Dummy tag</span>
                </li>
                <li class="tag">
                    <span>Dummy tag</span>
                </li>
            </ul>
            <section class="inspector-inline-property">
                <h3>Status:</h3>
                <span data-status>Complete</span>
            </section>
            <section class="inspector-inline-property">
                <h3>Date:</h3>
                <span data-date>10/11/2026</span>
            </section>
            <section class="inspector-block-property">
                <h3>Description:</h3>
                <p data-desc>My awesome website</p>
            </section>
            <section class="inspector-block-property">
                <h3>Highlights:</h3>
                <ul data-highlights></ul>
            </section>
            <section class="inspector-block-property">
                <h3>External links:</h3>
                <ul data-links></ul>
            </section>
            
        </article>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
