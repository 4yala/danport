<div id="project-inspector-overlay" class="screen-overlay">
    <button type="button" class="inspector-concealer">
        <img src="images/generic/left-pointer.png" alt="close-inspector-button">
    </button>
    <article class="inspector-container">
        <h2 data-title>My portfolio</h2>
        <div class="inspector-thumbnail">
            <img data-thumbnail src="images/projects/website-thumbnail.png" alt="">
        </div>
        <ul data-tags class="inspector-tags">
        </ul>
        <section class="inspector-inline-property">
            <h3>Status:</h3>
            <span data-status>Complete</span>
        </section>
        <section class="inspector-inline-property">
            <h3>Date:</h3>
            <span data-date>10/11/2026</span>
        </section>
        <section class="inspector-block-property">
            <h3>Description:</h3>
            <p data-desc>My awesome website</p>
        </section>
        <section class="inspector-block-property">
            <h3>Highlights:</h3>
            <ul data-highlights>
            </ul>
        </section>
        <section class="inspector-block-property">
            <h3>External links:</h3>
            <ul data-links>
            </ul>
        </section>

    </article>
</div>
